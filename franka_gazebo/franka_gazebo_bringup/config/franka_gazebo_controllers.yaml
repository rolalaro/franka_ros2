controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    # joint_position_example_controller:
    #   type: franka_example_controllers/JointPositionExampleController

    # joint_velocity_example_controller:
    #   type: franka_example_controllers/JointVelocityExampleController

    # joint_impedance_example_controller:
    #   type: franka_example_controllers/JointImpedanceExampleController

    # mobile_fr3_duo_joint_impedance_example_controller:
    #   type: franka_example_controllers/MobileFr3DuoJointImpedanceExampleController

    # fr3_duo_joint_impedance_example_controller:
    #   type: franka_example_controllers/Fr3DuoJointImpedanceExampleController

    # gravity_compensation_example_controller:
    #   type: franka_example_controllers/GravityCompensationExampleController

    # cartesian_impedance_example_controller:
    #   type: franka_example_controllers/CartesianImpedanceExampleController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # mobile_cartesian_velocity_controller:
    #   type: franka_example_controllers/MobileCartesianVelocityExampleController

    # swerve_ik_controller:
    #   type: franka_mobile/SwerveIKController

    # swerve_drive_controller:
    #   type: franka_mobile/SwerveDriveController

    # full_body_controller:
    #   type: mobile_fr3_duo_trajectory_controller/MobileFR3DuoTrajectoryController

    # spine_joint_trajectory_controller:
    #   type: joint_trajectory_controller/JointTrajectoryController

    joint_velocity_controller:
      type: joint_controllers/JointSpaceVelocityController

    joint_position_controller:
      type: joint_controllers/JointSpacePositionController

joint_velocity_controller:
  ros__parameters:
    use_sim_time: true
    joint_state_names:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7
    joint_command_names:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7
    interface_name: velocity
    velocity_scaling: 1.0

joint_position_controller:
  ros__parameters:
    use_sim_time: true
    joint_state_names:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7
    joint_command_names:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7
    interface_name: position
    velocity_scaling: 0.5

